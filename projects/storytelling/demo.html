<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clickable prototype · AI storytelling · Gabriele Leonelli</title>
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../../assets/site.css?v=8">
  <link rel="stylesheet" href="player.css?v=1">
  <style>
    /* Fits the player into whatever box shows it (the pop-up on the home page). */
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
    .wrap { margin: 0; padding: 0; width: 100%; max-width: calc((100vh - 150px) * 16 / 9); min-width: 280px; }
    .note { margin-top: 8px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="sr-only">AI storytelling: clickable prototype</h1>
    <div class="player" id="player">
      <div class="stage" id="stage" role="region" aria-label="Prototype screen">
        <img id="screen" src="screens/01-theme.webp?v=2" alt="">
      </div>
      <div class="caption">
        <span class="step" id="step"></span>
        <p class="text" id="text"></p>
        <div class="controls">
          <button id="prev" type="button">Back</button>
          <button id="next" type="button" class="primary">Next</button>
        </div>
      </div>
    </div>
    <p class="note">Click the highlighted areas as a child would, or use Next. In the prototype, the AI's lines are scripted.</p>
  </main>
  <script src="player.js?v=3"></script>
</body>
</html>
